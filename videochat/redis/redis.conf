port 6379
logfile /var/log/redis.log

# Only reachable from the docker network; never publish on 0.0.0.0
protected-mode yes

# Disable commands used by Redis worms (CONFIG SET dir/dbfilename, SLAVEOF + MODULE LOAD, DEBUG)
rename-command CONFIG ""
rename-command SLAVEOF ""
rename-command REPLICAOF ""
rename-command MODULE ""
rename-command DEBUG ""
